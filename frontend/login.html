<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — RepoMind AI</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body>

<canvas id="galaxy-canvas"></canvas>
<div class="page-veil"></div>

<a href="index.html" class="auth-back">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
  RepoMind AI
</a>

<div class="auth-shell">
  <div class="auth-card glass">
    <div class="auth-head">
      <h1>Welcome back</h1>
      <p>Log in to keep chatting with your repositories.</p>
    </div>

    <form id="login-form" novalidate>
      <div class="field" id="login-email-field">
        <label for="login-email">Email</label>
        <div class="field-input">
          <input type="email" id="login-email" placeholder="you@company.com" autocomplete="email" />
        </div>
        <p class="field-error">Enter a valid email address.</p>
      </div>

      <div class="field" id="login-password-field">
        <label for="login-password">Password</label>
        <div class="field-input">
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="toggle-visibility">SHOW</button>
        </div>
        <p class="field-error">Enter your password.</p>
      </div>

      <div class="field-row">
        <label class="checkbox-row" style="margin:0;">
          <input type="checkbox" /> Stay signed in
        </label>
        <a href="forgot-password.html" class="link-muted">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary auth-submit">Log in</button>
    </form>

    <div class="auth-divider">or continue with</div>
    <div class="oauth-row">
      <button class="oauth-btn" type="button">
        <svg viewBox="0 0 24 24"><path fill="#fff" d="M12 2C6.5 2 2 6.5 2 12c0 4.4 2.9 8.2 6.8 9.5.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.5-1.1-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.7.4-1.1.6-1.4-2.3-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.5-1.3.1-2.7 0 0 .8-.3 2.7 1a9.3 9.3 0 0 1 4.9 0c1.9-1.3 2.7-1 2.7-1 .6 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.3 4.7-4.6 5 .4.3.7 1 .7 2v3c0 .3.2.6.7.5A10 10 0 0 0 22 12c0-5.5-4.5-10-10-10z"/></svg>
        Continue with GitHub
      </button>
      <button class="oauth-btn" type="button">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2.1 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2z"/><path fill="#EA4335" d="M12 5.8c1.5 0 2.8.5 3.8 1.5l2.8-2.8C16.9 2.7 14.6 1.8 12 1.8A10 10 0 0 0 3.1 7.4l3.3 2.6C7.2 7.6 9.4 5.8 12 5.8z"/></svg>
        Continue with Google
      </button>
    </div>

    <p class="auth-footer-note">Don't have an account? <a href="signup.html">Sign up free</a></p>
  </div>
</div>

<script type="module" src="js/galaxy.js"></script>
<script src="js/auth.js" defer></script>
</body>
</html>
