<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset your password — RepoMind AI</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body>

<canvas id="galaxy-canvas"></canvas>
<div class="page-veil"></div>

<a href="login.html" class="auth-back">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
  Back to log in
</a>

<div class="auth-shell">
  <div class="auth-card glass">

    <div id="forgot-request-state">
      <div class="auth-head">
        <h1>Reset your password</h1>
        <p>Enter your email and we'll send you a reset link.</p>
      </div>

      <form id="forgot-form" novalidate>
        <div class="field" id="forgot-email-field" style="margin-bottom:26px;">
          <label for="forgot-email">Email</label>
          <div class="field-input">
            <input type="email" id="forgot-email" placeholder="you@company.com" autocomplete="email" />
          </div>
          <p class="field-error">Enter a valid email address.</p>
        </div>
        <button type="submit" class="btn btn-primary auth-submit">Send reset link</button>
      </form>
    </div>

    <div id="forgot-success-state" style="display:none;">
      <div class="auth-success">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/></svg>
        </div>
        <p>If an account exists for <strong id="forgot-sent-email"></strong>, a reset link is on its way. Check your inbox — and your spam folder, just in case.</p>
      </div>
      <a href="login.html" class="btn btn-ghost auth-submit" style="justify-content:center;">Back to log in</a>
    </div>

  </div>
</div>

<script type="module" src="js/galaxy.js"></script>
<script src="js/auth.js" defer></script>
</body>
</html>
