<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signing you in — RepoMind AI</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body>

<canvas id="galaxy-canvas"></canvas>
<div class="page-veil"></div>

<div class="auth-shell">
  <div class="auth-card glass" style="text-align:center;">
    <div id="callback-loading">
      <div class="stage-ring" style="margin: 0 auto 22px; width:52px; height:52px; border:2px solid var(--panel-border); border-top-color: var(--cyan); border-right-color: var(--blue); border-radius:50%; animation: spin 1s linear infinite;"></div>
      <p style="color:var(--ink-1); font-size:14px;">Finishing sign-in…</p>
    </div>
    <div id="callback-error" style="display:none;">
      <div class="icon-circle" style="background:rgba(255,122,144,0.12); border-color:rgba(255,122,144,0.3);">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ff7a90" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      </div>
      <p id="callback-error-text" style="color:var(--ink-1); font-size:14px; margin-bottom:22px;"></p>
      <a href="login.html" class="btn btn-primary" style="justify-content:center;">Back to log in</a>
    </div>
  </div>
</div>

<style>@keyframes spin { to { transform: rotate(360deg); } }</style>

<script type="module" src="js/galaxy.js"></script>
<script src="js/api.js" defer></script>
<script src="js/oauth-callback.js" defer></script>
</body>
</html>
